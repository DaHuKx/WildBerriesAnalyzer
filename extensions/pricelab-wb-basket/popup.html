<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PriceLab — корзина WB</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      body {
        margin: 0;
        width: 320px;
        padding: 14px;
        color: #0f172a;
        background: #fff;
      }

      .brand {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #0f766e;
        margin: 0 0 4px;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }

      .meta {
        font-size: 12px;
        color: #64748b;
        margin: 0 0 10px;
        line-height: 1.4;
      }

      .preview {
        min-height: 64px;
        max-height: 140px;
        overflow: auto;
        font-size: 12px;
        line-height: 1.4;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        margin-bottom: 10px;
      }

      button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: #0f766e;
        color: #fff;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: #94a3b8;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <p class="brand">PRICELAB</p>
    <h1>Артикулы корзины WB</h1>
    <p class="meta" id="meta">Откройте страницу корзины Wildberries.</p>
    <div class="preview" id="preview">—</div>
    <button id="copy" disabled>Скопировать артикулы</button>
    <p class="hint">
      На странице корзины расширение само прокручивает список и показывает панель
      копирования. Затем вставьте артикулы в PriceLab или бота.
    </p>
    <script src="popup.js"></script>
  </body>
</html>
